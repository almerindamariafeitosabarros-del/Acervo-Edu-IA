services:
  db:
    image: postgres:16-alpine
    container_name: acervo_edu_ia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acervo_edu_ia}
      POSTGRES_USER: ${POSTGRES_USER:-acervo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acervo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acervo} -d ${POSTGRES_DB:-acervo_edu_ia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: acervo_edu_ia_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: acervo_edu_ia_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
